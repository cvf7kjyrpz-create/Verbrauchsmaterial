<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Spesen Pro</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Spesen">
    
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #1a1a1a;
            --input-bg: #262626;
            --text-main: #ffffff;
            --text-dim: #a3a3a3;
            --accent: #404040; /* Neutrales Dunkelgrau */
            --danger: #b91c1c;
            --border-radius: 10px;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden; /* Verhindert Scrollen auf der Hauptseite */
            display: flex;
            flex-direction: column;
            padding: env(safe-area-inset-top) 15px env(safe-area-inset-bottom) 15px;
        }

        /* Navigations-Logik */
        .view {
            display: none;
            flex-direction: column;
            height: 100%;
            padding-top: 20px;
        }

        .view.active {
            display: flex;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.2rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-dim);
        }

        /* Kompakte Stats */
        .stats-mini {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .stat-box {
            background: var(--card-bg);
            padding: 12px;
            border-radius: var(--border-radius);
            text-align: center;
            border: 1px solid #333;
        }

        .stat-label {
            font-size: 0.65rem;
            color: var(--text-dim);
            text-transform: uppercase;
            display: block;
        }

        .stat-val {
            font-size: 1.1rem;
            font-weight: bold;
        }

        /* Kompaktes Formular */
        .form-card {
            background: var(--card-bg);
            padding: 15px;
            border-radius: var(--border-radius);
            border: 1px solid #333;
        }

        .field {
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-size: 0.75rem;
            color: var(--text-dim);
            margin-bottom: 4px;
            margin-left: 2px;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #404040;
            background: var(--input-bg);
            color: white;
            font-size: 1rem;
            outline: none;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.9rem;
            transition: opacity 0.2s;
        }

        .btn-main {
            background: #ffffff;
            color: #000000;
            margin-top: 5px;
        }

        .btn-nav {
            background: #333;
            color: white;
            margin-top: 15px;
        }

        /* Listen-Ansicht */
        #view-list {
            overflow-y: auto; /* Scrollen nur in der Liste erlaubt */
        }

        .list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .expense-item {
            background: var(--card-bg);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 3px solid #444;
        }

        .item-info .name {
            font-weight: 500;
            display: block;
            font-size: 0.95rem;
        }

        .item-info .sub {
            font-size: 0.7rem;
            color: var(--text-dim);
        }

        .item-right {
            text-align: right;
            display: flex;
            align-items: center;
        }

        .item-amount {
            font-weight: bold;
            font-size: 0.95rem;
        }

        .del-btn {
            background: none;
            border: none;
            color: var(--danger);
            margin-left: 12px;
            font-size: 1rem;
        }

        .action-bar {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: auto;
            padding-top: 15px;
            padding-bottom: 10px;
        }

        .btn-small {
            font-size: 0.75rem;
            padding: 8px;
            background: #262626;
            color: white;
            border: 1px solid #444;
        }

        /* PDF & Druck Optimierung */
        @media print {
            body { 
                background: white !important; 
                color: black !important; 
                overflow: visible !important;
                height: auto !important;
            }
            .view { display: none !important; }
            #view-list { display: block !important; overflow: visible !important; }
            .btn, .del-btn, .action-bar, .btn-nav { display: none !important; }
            .stat-box { 
                background: #f2f2f2 !important; 
                color: black !important; 
                border: 1px solid #ccc !important;
            }
            .expense-item { 
                background: white !important; 
                border: 1px solid #eee !important;
                color: black !important;
                page-break-inside: avoid;
            }
            .item-info .sub { color: #666 !important; }
            h1 { color: black !important; margin-bottom: 10px; }
            @page { margin: 1cm; size: auto; }
        }
    </style>
</head>
<body>

    <div id="view-home" class="view active">
        <header>
            <h1>Neue Ausgabe</h1>
        </header>

        <div class="stats-mini">
            <div class="stat-box">
                <span class="stat-label">Gesamt</span>
                <span class="stat-val" id="home-total">0,00 €</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">Einträge</span>
                <span class="stat-val" id="home-count">0</span>
            </div>
        </div>

        <div class="form-card">
            <div class="field">
                <label>Artikel / Dienstleistung</label>
                <input type="text" id="desc" placeholder="z.B. Klebeband" autocomplete="off">
            </div>
            <div class="field">
                <label>Betrag in €</label>
                <input type="number" id="amount" step="0.01" placeholder="0.00" inputmode="decimal">
            </div>
            <div class="field">
                <label>Kategorie</label>
                <select id="category">
                    <option value="Büromaterial">Büromaterial</option>
                    <option value="Werkzeug">Werkzeug</option>
                    <option value="Fahrtkosten">Fahrtkosten</option>
                    <option value="Sonstiges">Sonstiges</option>
                </select>
            </div>
            <button class="btn btn-main" onclick="addExpense()">Eintrag speichern</button>
        </div>

        <button class="btn btn-nav" onclick="showView('view-list')">Liste anzeigen →</button>
        
        <div style="margin-top: auto; padding-bottom: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <button class="btn btn-small" onclick="backupData()">Backup</button>
            <button class="btn btn-small" onclick="document.getElementById('importFile').click()">Laden</button>
        </div>
    </div>

    <div id="view-list" class="view">
        <div class="list-header">
            <button class="btn-small" onclick="showView('view-home')" style="width: auto; padding: 5px 15px;">← Zurück</button>
            <h1 style="margin: 0;">Alle Ausgaben</h1>
        </div>

        <div id="expense-container" style="flex: 1;">
            </div>

        <div class="action-bar">
            <button class="btn btn-small" onclick="window.print()">PDF Export</button>
            <button class="btn btn-small" onclick="exportCSV()">CSV (Steuer)</button>
        </div>
    </div>

    <input type="file" id="importFile" style="display:none" onchange="restoreData(event)">

    <script>
        let expenses = JSON.parse(localStorage.getItem('expenses')) || [];

        function showView(viewId) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
            render();
        }

        function render() {
            const container = document.getElementById('expense-container');
            const hTotal = document.getElementById('home-total');
            const hCount = document.getElementById('home-count');
            
            container.innerHTML = '';
            let total = 0;

            expenses.sort((a, b) => new Date(b.date) - new Date(a.date));

            expenses.forEach((item, index) => {
                total += parseFloat(item.amount);
                const div = document.createElement('div');
                div.className = 'expense-item';
                div.innerHTML = `
                    <div class="item-info">
                        <span class="name">${item.desc}</span>
                        <span class="sub">${new Date(item.date).toLocaleDateString('de-DE')} | ${item.category}</span>
                    </div>
                    <div class="item-right">
                        <span class="item-amount">${parseFloat(item.amount).toFixed(2).replace('.', ',')} €</span>
                        <button class="del-btn" onclick="deleteExpense(${index})">✕</button>
                    </div>
                `;
                container.appendChild(div);
            });

            hTotal.innerText = total.toFixed(2).replace('.', ',') + ' €';
            hCount.innerText = expenses.length;
            localStorage.setItem('expenses', JSON.stringify(expenses));
        }

        function addExpense() {
            const desc = document.getElementById('desc').value;
            const amount = document.getElementById('amount').value;
            const category = document.getElementById('category').value;

            if(!desc || !amount) return alert("Fehlende Daten!");

            expenses.push({
                desc,
                amount,
                category,
                date: new Date().toISOString()
            });

            document.getElementById('desc').value = '';
            document.getElementById('amount').value = '';
            render();
            alert("Gespeichert!");
        }

        function deleteExpense(index) {
            if(confirm("Löschen?")) {
                expenses.splice(index, 1);
                render();
            }
        }

        function exportCSV() {
            let csv = "\uFEFFDatum;Beschreibung;Kategorie;Betrag\n";
            expenses.forEach(item => {
                const date = new Date(item.date).toLocaleDateString('de-DE');
                csv += `${date};${item.desc};${item.category};${item.amount.replace('.', ',')}\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `Steuer_Export.csv`;
            link.click();
        }

        function backupData() {
            const data = JSON.stringify(expenses);
            const blob = new Blob([data], { type: 'application/json' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `Backup_Spesen.json`;
            link.click();
        }

        function restoreData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    expenses = JSON.parse(e.target.result);
                    render();
                    alert("Daten geladen!");
                } catch(err) { alert("Fehler!"); }
            };
            reader.readAsText(file);
        }

        render();
    </script>
</body>
</html>
