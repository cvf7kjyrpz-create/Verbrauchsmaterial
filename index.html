<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Spesen Pro</title>
    
    <!-- iPhone Web App Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Spesen">
    
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #111111;
            --input-bg: #1c1c1c;
            --text-main: #ffffff;
            --text-dim: #888888;
            --accent: #2a2a2a;
            --danger: #991b1b;
            --edit: #0284c7;
            --border-radius: 12px;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            padding: env(safe-area-inset-top) 15px env(safe-area-inset-bottom) 15px;
        }

        .view {
            display: none;
            flex-direction: column;
            height: 100%;
            padding-top: 10px;
        }

        .view.active {
            display: flex;
        }

        header {
            text-align: center;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 1rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-dim);
        }

        /* Stats */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .stat-card {
            background: var(--card-bg);
            padding: 12px;
            border-radius: var(--border-radius);
            text-align: center;
            border: 1px solid #222;
        }

        .stat-label {
            font-size: 0.6rem;
            color: var(--text-dim);
            text-transform: uppercase;
            display: block;
            margin-bottom: 2px;
        }

        .stat-val {
            font-size: 1rem;
            font-weight: bold;
        }

        /* Form */
        .form-container {
            background: var(--card-bg);
            padding: 15px;
            border-radius: var(--border-radius);
            border: 1px solid #222;
        }

        .input-row {
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-size: 0.7rem;
            color: var(--text-dim);
            margin-bottom: 4px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #333;
            background: var(--input-bg);
            color: white;
            font-size: 1rem;
            outline: none;
        }

        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 5px;
            padding: 5px 0;
        }

        .checkbox-row input {
            width: 20px;
            height: 20px;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: none;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-add { background: #ffffff; color: #000; margin-top: 10px; }
        .btn-nav { background: #222; color: #fff; margin-top: 15px; }
        .btn-action { background: #1a1a1a; color: #fff; border: 1px solid #333; font-size: 0.75rem; padding: 10px; }

        /* List View */
        #view-list { overflow-y: auto; }
        
        .filter-section {
            background: var(--card-bg);
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .expense-list-container {
            flex: 1;
            padding-bottom: 20px;
        }

        .item {
            background: var(--card-bg);
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #1a1a1a;
        }

        .item-name { font-weight: 600; font-size: 0.9rem; display: block; }
        .item-meta { font-size: 0.7rem; color: var(--text-dim); }
        .item-price { font-weight: bold; font-size: 0.9rem; margin-right: 5px; }
        
        .action-btns {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        .icon-btn { 
            background: none; 
            border: none; 
            font-size: 1.1rem; 
            padding: 5px;
        }
        
        .edit-btn { color: var(--edit); }
        .del-btn { color: var(--danger); }

        /* Print Settings */
        @media print {
            body { background: white !important; color: black !important; overflow: visible !important; height: auto !important; }
            .view { display: none !important; }
            #view-list { display: block !important; }
            .btn, .filter-section, .action-btns, header, .btn-nav { display: none !important; }
            .item { border: 1px solid #ccc !important; background: white !important; color: black !important; margin-bottom: 5px; }
            .item-meta { color: #555 !important; }
            .stat-card { background: white !important; border: 1px solid #ccc !important; color: black !important; }
        }
    </style>
</head>
<body>

    <!-- HOME: EINGABE -->
    <div id="view-home" class="view active">
        <header><h1>Ausgabe Erfassen</h1></header>

        <div class="stats-grid">
            <div class="stat-card">
                <span class="stat-label">Gesamt</span>
                <span class="stat-val" id="total-val">0,00 €</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">Einträge</span>
                <span class="stat-val" id="total-count">0</span>
            </div>
        </div>

        <div class="form-container">
            <div class="input-row">
                <label>Bezeichnung</label>
                <input type="text" id="desc" placeholder="z.B. Klebeband" autocomplete="off">
            </div>
            <div class="input-row">
                <label>Betrag in €</label>
                <input type="number" id="amount" step="0.01" placeholder="0.00" inputmode="decimal">
            </div>
            <div class="input-row">
                <label>Kategorie</label>
                <select id="category">
                    <option value="Internet">Internet</option>
                    <option value="Telefon">Telefon</option>
                    <option value="Community">Community</option>
                    <option value="Büromaterial">Büromaterial</option>
                    <option value="Werkzeug">Werkzeug</option>
                    <option value="Sonstiges">Sonstiges</option>
                </select>
            </div>
            <div class="checkbox-row">
                <input type="checkbox" id="recurring">
                <label for="recurring" style="margin:0">Monatlich wiederkehrend</label>
            </div>
            <button class="btn btn-add" onclick="addExpense()">Speichern</button>
        </div>

        <button class="btn btn-nav" onclick="showView('view-list')">Liste & Export →</button>
        
        <div style="margin-top: auto; padding-bottom: 15px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
            <button class="btn btn-action" onclick="backup()">Backup (JSON)</button>
            <button class="btn btn-action" onclick="document.getElementById('imp').click()">Laden</button>
        </div>
    </div>

    <!-- LISTE & FILTER -->
    <div id="view-list" class="view">
        <header style="display:flex; justify-content: space-between; align-items:center;">
            <button onclick="showView('view-home')" style="background:none; border:none; color:white; font-size:0.8rem;">← Zurück</button>
            <h1>Übersicht</h1>
            <div style="width:50px"></div>
        </header>

        <div class="filter-section">
            <div>
                <label>Von</label>
                <input type="date" id="filter-from" onchange="render()">
            </div>
            <div>
                <label>Bis</label>
                <input type="date" id="filter-to" onchange="render()">
            </div>
        </div>

        <div id="list-container" class="expense-list-container"></div>

        <div style="padding-bottom: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <button class="btn btn-action" onclick="window.print()">PDF Export</button>
            <button class="btn btn-action" onclick="exportCSV()">CSV (Steuer)</button>
        </div>
    </div>

    <input type="file" id="imp" style="display:none" onchange="restore(event)">

    <script>
        let expenses = JSON.parse(localStorage.getItem('expenses')) || [];
        let recurringItems = JSON.parse(localStorage.getItem('recurringItems')) || [];
        let lastRecurringCheck = localStorage.getItem('lastCheck') || "";

        // Eindeutige ID generieren (verhindert Fehler beim Löschen/Bearbeiten im gefilterten Zustand)
        function generateId() {
            return Date.now().toString() + Math.random().toString(36).substring(2, 9);
        }

        // Automatische Prüfung auf neue Monate für wiederkehrende Kosten
        function checkRecurring() {
            const now = new Date();
            const currentMonthKey = `${now.getFullYear()}-${now.getMonth()}`;
            
            if (lastRecurringCheck !== currentMonthKey) {
                recurringItems.forEach(item => {
                    // Prüfen, ob für diesen Monat schon ein Eintrag existiert
                    const alreadyAdded = expenses.find(e => 
                        e.desc === item.desc && 
                        e.category === item.category &&
                        new Date(e.date).getMonth() === now.getMonth() &&
                        new Date(e.date).getFullYear() === now.getFullYear() &&
                        e.isAuto === true
                    );

                    if (!alreadyAdded) {
                        expenses.push({
                            id: generateId(),
                            desc: item.desc,
                            amount: item.amount,
                            category: item.category,
                            date: new Date().toISOString(),
                            isAuto: true
                        });
                    }
                });
                localStorage.setItem('lastCheck', currentMonthKey);
                save();
            }
        }

        function showView(id) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            render();
        }

        function save() {
            localStorage.setItem('expenses', JSON.stringify(expenses));
            localStorage.setItem('recurringItems', JSON.stringify(recurringItems));
        }

        function addExpense() {
            const desc = document.getElementById('desc').value;
            const amount = document.getElementById('amount').value;
            const category = document.getElementById('category').value;
            const isRecurring = document.getElementById('recurring').checked;

            if(!desc || !amount) return alert("Bitte alles ausfüllen");

            const newItem = { 
                id: generateId(), 
                desc, 
                amount, 
                category, 
                date: new Date().toISOString() 
            };
            
            expenses.push(newItem);
            
            if (isRecurring) {
                // Speichert die Vorlage, ohne die ID (damit sie jeden Monat neu generiert werden kann)
                recurringItems.push({ desc, amount, category });
            }

            document.getElementById('desc').value = '';
            document.getElementById('amount').value = '';
            document.getElementById('recurring').checked = false;
            
            save();
            render();
            alert("Erfolgreich gespeichert!");
        }

        function render() {
            const container = document.getElementById('list-container');
            const fromDate = document.getElementById('filter-from').value;
            const toDate = document.getElementById('filter-to').value;
            
            container.innerHTML = '';
            let total = 0;

            // Filtern
            let filtered = expenses.sort((a,b) => new Date(b.date) - new Date(a.date));
            if (fromDate) filtered = filtered.filter(e => new Date(e.date) >= new Date(fromDate));
            if (toDate) {
                let end = new Date(toDate);
                end.setHours(23,59,59);
                filtered = filtered.filter(e => new Date(e.date) <= end);
            }

            filtered.forEach(item => {
                total += parseFloat(item.amount);
                
                // Fallback, falls alte Einträge keine ID haben
                if(!item.id) item.id = generateId(); 

                const div = document.createElement('div');
                div.className = 'item';
                div.innerHTML = `
                    <div>
                        <span class="item-name">${item.desc} ${item.isAuto ? '🔄' : ''}</span>
                        <span class="item-meta">${new Date(item.date).toLocaleDateString('de-DE')} | ${item.category}</span>
                    </div>
                    <div style="display:flex; align-items:center;">
                        <span class="item-price">${parseFloat(item.amount).toFixed(2).replace('.', ',')} €</span>
                        <div class="action-btns">
                            <button class="icon-btn edit-btn" onclick="editExpense('${item.id}')">✎</button>
                            <button class="icon-btn del-btn" onclick="removeExpense('${item.id}')">✕</button>
                        </div>
                    </div>
                `;
                container.appendChild(div);
            });

            document.getElementById('total-val').innerText = total.toFixed(2).replace('.', ',') + ' €';
            document.getElementById('total-count').innerText = filtered.length;
        }

        function editExpense(id) {
            const expense = expenses.find(e => e.id === id);
            if (!expense) return;

            let newVal = prompt(`Neuen Betrag für '${expense.desc}' eingeben:`, expense.amount);
            
            if (newVal !== null && newVal.trim() !== "") {
                newVal = newVal.replace(',', '.'); // Komma in Punkt umwandeln für Berechnung
                if (!isNaN(newVal)) {
                    expense.amount = newVal;
                    save();
                    render();
                } else {
                    alert("Bitte eine gültige Zahl eingeben.");
                }
            }
        }

        function removeExpense(id) {
            if(confirm("Diesen Eintrag wirklich löschen?")) {
                expenses = expenses.filter(e => e.id !== id);
                save();
                render();
            }
        }

        function exportCSV() {
            const fromDate = document.getElementById('filter-from').value;
            const toDate = document.getElementById('filter-to').value;
            
            let filtered = expenses;
            if (fromDate) filtered = filtered.filter(e => new Date(e.date) >= new Date(fromDate));
            if (toDate) {
                let end = new Date(toDate);
                end.setHours(23,59,59);
                filtered = filtered.filter(e => new Date(e.date) <= end);
            }

            let csv = "\uFEFFDatum;Bezeichnung;Kategorie;Betrag\n";
            filtered.forEach(e => {
                csv += `${new Date(e.date).toLocaleDateString('de-DE')};${e.desc};${e.category};${e.amount.replace('.', ',')}\n`;
            });
            
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `Export_Steuer_${fromDate||'Start'}_bis_${toDate||'Ende'}.csv`;
            a.click();
        }

        function backup() {
            const data = JSON.stringify({expenses, recurringItems});
            const blob = new Blob([data], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `Spesen_Backup_${new Date().toISOString().split('T')[0]}.json`;
            a.click();
        }

        function restore(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const data = JSON.parse(e.target.result);
                    expenses = data.expenses || [];
                    recurringItems = data.recurringItems || [];
                    
                    // Alten Daten eine ID geben, falls sie aus einem alten Backup stammen
                    expenses.forEach(item => { if(!item.id) item.id = generateId(); });
                    
                    save();
                    render();
                    alert("Daten erfolgreich geladen!");
                } catch (err) {
                    alert("Fehler beim Laden der Datei.");
                }
            };
            reader.readAsText(file);
        }

        // App Start
        checkRecurring();
        render();
    </script>
</body>
</html>
